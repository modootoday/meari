[build]
# Relative to the repo root (parent of .cargo/). Worktrees get their own cache; set CARGO_TARGET_DIR to share.
target-dir = "runtime/build-cache/target"
jobs = 1
incremental = false # replaces CARGO_INCREMENTAL=0 from runtime/env.sh

[env]
TMP = { value = "runtime/build-cache/tmp", relative = true, force = true }
TEMP = { value = "runtime/build-cache/tmp", relative = true, force = true }

[alias]
xtask = "run --package xtask --"
