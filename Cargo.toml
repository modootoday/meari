[workspace]
members = ["packages/meari", "packages/meari-native", "packages/meari-native-tools", "packages/meari-builder"]
default-members = ["packages/meari"]
exclude = ["verification/native-hmr", "packages/meari-paint"]
resolver = "3"

[workspace.dependencies]
meari = { path = "packages/meari", version = "0.1.0" }

[patch.crates-io]
blitz-paint = { path = "packages/meari-paint" }
