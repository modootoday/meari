[workspace]
members = ["crates/meari", "crates/meari-native", "crates/meari-platform", "crates/meari-native-tools", "crates/meari-builder", "crates/meari-cli", "crates/meari-paint", "crates/meari-visual", "crates/meari-demo", "xtask"]
default-members = ["crates/meari"]
exclude = ["verification/native-hmr"]
resolver = "3"

[workspace.dependencies]
meari = { path = "crates/meari", version = "0.1.0" }
meari-platform = { path = "crates/meari-platform", version = "0.1.0" }

[patch.crates-io]
blitz-paint = { path = "crates/meari-paint" }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.dev.package."*"]
debug = false

# Web font slicing and cache verification run in tests and the visual test; unoptimized they
# take minutes on the CJK faces.
[profile.dev.package.fontcull-skrifa]
opt-level = 3
[profile.dev.package.fontcull-klippa]
opt-level = 3
[profile.dev.package.fontcull-read-fonts]
opt-level = 3
[profile.dev.package.fontcull-write-fonts]
opt-level = 3
[profile.dev.package.ttf2woff2]
opt-level = 3
[profile.dev.package.brotli]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
