[package]
name = "meari-visual"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Visual regression harness: same TSX fixture rendered by meari-native (offscreen CPU) and by the Web DOM plan in headless Chrome, compared pixel by pixel."

[dependencies]
blitz-dom = { version = "=0.3.0-beta.4", default-features = false }
meari = { workspace = true }
meari-platform = { workspace = true }
meari-native = { path = "../meari-native", version = "0.1.0" }
png = "=0.18.1"
serde_json = "1"
sha2 = "=0.10.9"
