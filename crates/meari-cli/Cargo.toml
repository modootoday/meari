[package]
workspace = "../.."
name = "meari-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Unified `meari` command line: convert, native, build"
repository.workspace = true
readme = "README.md"

[features]
window = ["meari-native/window"]
gl = ["meari-native/gl"]

[dependencies]
meari = { workspace = true }
meari-native = { path = "../meari-native", version = "0.2.0" }
meari-builder = { path = "../meari-builder", version = "0.2.0" }

[[bin]]
name = "meari"
path = "src/main.rs"

[[test]]
name = "dispatch"
path = "tests/cli/dispatch.rs"
