[package]
workspace = "../.."
name = "meari-native"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Native CSS, rendering and OS adapters for Meari"
repository = "https://github.com/modootoday/meari"
include = [
    "src/**/*.rs", "tests/**/*.rs", "fixtures/**/*.tsx", "fixtures/**/*.json",
    "fixtures/**/*.md", "assets/**/*.svg",
    "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "NOTICE",
    "!**/.spec/**", "!**/target/**", "!**/node_modules/**", "!**/.cache/**",
    "!**/downloads/**", "!**/captures/**", "!**/screenshots/**", "!**/cache/**",
    "!**/.env", "!**/.env.*", "!**/credentials.json",
]

[features]
default = ["bundled-fonts"]
bundled-fonts = ["meari/bundled-fonts"]
test-support = ["window"]
gl = ["meari-platform/gl", "dep:anyrender_skia", "dep:skia-safe", "dep:glow"]
window = ["meari-platform/window", "dep:blitz-shell", "dep:winit", "dep:accesskit_xplat", "anyrender_vello_cpu/softbuffer_window_renderer"]

[[test]]
name = "bundled_font_catalog"
path = "tests/pages/bundled_font_catalog.rs"
required-features = ["bundled-fonts"]

[dependencies]
meari = { workspace = true }
meari-platform = { workspace = true }
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["accessibility", "system-fonts", "svg", "complex-scripts"] }
blitz-html = "=0.3.0-beta.4"
blitz-paint = { version = "=0.3.0-beta.4", path = "../meari-paint", features = ["scrollbars"] }
blitz-traits = "=0.3.0-beta.4"
parley = { version = "=0.12.0", default-features = false, features = ["std", "system"] }
blitz-shell = { version = "=0.3.0-beta.4", optional = true, default-features = false, features = ["clipboard"] }
winit = { version = "=0.31.0-beta.3", optional = true }
accesskit_xplat = { version = "=0.2.0", optional = true, default-features = false }
accesskit = { version = "=0.25.1", features = ["serde"] }
keyboard-types = "=0.8.3"
anyrender = "=0.14.0"
anyrender_vello_cpu = { version = "=0.18.0", features = ["filters"] }
anyrender_skia = { version = "=0.12.0", optional = true }
skia-safe = { version = "=0.153.3", features = ["gl", "textlayout"], optional = true }
glow = { version = "=0.16.0", optional = true }
dioxus-shadcn-primitives = { version = "=0.6.6", features = ["dialog", "dropdown", "select", "runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "=0.18.1"
sha2 = "0.10"
regex = "1"
rfd = { version = "=0.17.2", default-features = false }
cssparser = "=0.38.0"
roxmltree = "=0.21.1"
usvg = "=0.48.1"
ttf-parser = "=0.25.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
style = { package = "stylo", version = "=0.22.0" }
style_traits = { package = "stylo_traits", version = "=0.22.0" }
oxc_allocator = "=0.154.0"
oxc_ast = "=0.154.0"
oxc_parser = "=0.154.0"
oxc_span = "=0.154.0"

# Linux/BSD needs an explicit rfd backend; xdg-portal avoids a GTK system dependency.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Graphics_Gdi", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_LibraryLoader"] }

