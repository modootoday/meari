[package]
workspace = "../.."
name = "meari-builder"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust Native/Web app compiler adapters and build CLI for Meari"
repository.workspace = true
readme = "README.md"
include = [
    "src/**/*.rs", "tests/**/*.rs", "fixtures/**/*.rs", "fixtures/**/*.tsx",
    "fixtures/**/*.json", "fixtures/**/*.md",
    "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "NOTICE",
    "!**/.spec/**", "!**/target/**", "!**/node_modules/**", "!**/.cache/**",
    "!**/downloads/**", "!**/captures/**", "!**/screenshots/**", "!**/cache/**",
    "!**/.env", "!**/.env.*", "!**/credentials.json",
]

[dependencies]
meari = { workspace = true }
meari-platform = { workspace = true }
meari-native = { path = "../meari-native", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
getrandom = "=0.4.3"

[[test]]
name = "project"
path = "tests/build/project.rs"
