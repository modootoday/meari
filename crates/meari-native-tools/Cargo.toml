[package]
workspace = "../.."
name = "meari-native-tools"
version.workspace = true
edition.workspace = true
default-run = "meari-native"
license.workspace = true
description = "Native showcase and batch kitchen-sink executable hosts for Meari"
repository.workspace = true
readme = "README.md"
include = [
    "src/**/*.rs", "tests/**/*.rs",
    "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "NOTICE",
]

[features]
test-support = ["meari-native/test-support"]
gl = ["meari-native/gl"]
window-gpu = ["window", "meari-native/window-gpu"]
window = ["meari-native/window"]

[dependencies]
meari-native = { path = "../meari-native", version = "0.3.0" }

[[bin]]
name = "meari-native"
path = "src/main.rs"

[[bin]]
name = "meari-kitchen-sink"
path = "src/bin/kitchen_sink.rs"

[[test]]
name = "cli_entrypoints"
path = "tests/cli/cli_entrypoints.rs"

[[bin]]
name = "meari-resize-probe"
path = "src/bin/resize_probe.rs"
required-features = ["window"]
